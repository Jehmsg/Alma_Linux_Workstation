---
- name: Configure SSSD LDAP Settings
  hosts: localhost
  connection: local
  become: true
  vars:
    realm_name: "alongsidegroup.com"

  tasks:
    - name: Ensure SSSD is running
      ansible.builtin.service:
        name: sssd
        enabled: yes
        state: started

    - name: Set fallback_homedir
      ansible.builtin.ini_file:
        path: /etc/sssd/sssd.conf
        section: "domain/{{ realm_name }}"
        option: fallback_homedir
        value: /home/%u

    - name: Set use_fully_qualified_names
      ansible.builtin.ini_file:
        path: /etc/sssd/sssd.conf
        section: "domain/{{ realm_name }}"
        option: use_fully_qualified_names
        value: "False"

    - name: Set ldap_idmap_range_min
      ansible.builtin.ini_file:
        path: /etc/sssd/sssd.conf
        section: "domain/{{ realm_name }}"
        option: ldap_idmap_range_min
        value: "1260388352"

    - name: Set ldap_idmap_default_domain_sid
      ansible.builtin.ini_file:
        path: /etc/sssd/sssd.conf
        section: "domain/{{ realm_name }}"
        option: ldap_idmap_default_domain_sid
        value: "S-1-5-21-2080557663-2646592229-2320375442"

    - name: Stop SSSD
      ansible.builtin.service:
        name: sssd
        state: stopped

    - name: Find SSSD cache files (idmap + memory cache)
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: true
        file_type: file
      loop:
        - /var/lib/sss/db
        - /var/lib/sss/mc
      register: sssd_cache_files

    - name: Flush SSSD cache (idmap + memory cache)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ sssd_cache_files.results | map(attribute='files') | flatten | list }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Start SSSD
      ansible.builtin.service:
        name: sssd
        enabled: yes
        state: started