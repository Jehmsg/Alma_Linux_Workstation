---
- name: Create Deadline User Home Directory
  hosts: localhost
  connection: local
  become: true
  vars:
    deadline_user: "deadline.user"
    deadline_gid: 1260388865

  tasks:
    # Run after domain join + SSSD config so the AD user and mapped group resolve.
    # mkhomedir_helper (oddjob-mkhomedir) creates the home directory, copies
    # /etc/skel contents into it, and sets ownership in one idempotent call.
    - name: Create /home/{{ deadline_user }} via mkhomedir_helper
      ansible.builtin.command:
        cmd: mkhomedir_helper {{ deadline_user }}
      register: deadline_home
      changed_when: "'already exists' not in deadline_home.stdout"

    - name: Install .bash_profile for {{ deadline_user }}
      ansible.builtin.copy:
        src: Files/bash_profile
        dest: "/home/{{ deadline_user }}/.bash_profile"
        owner: "{{ deadline_user }}"
        group: "{{ deadline_gid }}"
        mode: "0644"
