---
- name: Configure NFS Mounts
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Create ASLON NFS mount point
      ansible.builtin.file:
        path: /mnt/aslon
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Add ASLON NFS entry to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^synology\.alongsidegroup\.com:/volume1/ASLON'
        line: 'synology.alongsidegroup.com:/volume1/ASLON /mnt/aslon nfs defaults,nofail,nfsvers=3,sec=sys,x-systemd.after=nss-lookup.target,x-systemd.automount'
        create: true

    - name: Mount ASLON NFS share
      ansible.builtin.command:
        cmd: mount /mnt/aslon
      register: _mount_result
      changed_when: _mount_result.rc == 0
      failed_when: _mount_result.rc != 0
