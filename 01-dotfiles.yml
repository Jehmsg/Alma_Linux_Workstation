---
- name: Deploy Dotfiles & Shell Profiles
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Deploy /etc/profile
      copy:
        src: Files/profile
        dest: /etc/profile
        owner: root
        group: root
        mode: '0644'

    - name: Deploy /etc/skel/.bash_profile
      copy:
        src: Files/bash_profile
        dest: /etc/skel/.bash_profile
        owner: root
        group: root
        mode: '0644'

    - name: Remove legacy /etc/profile.d/umask.sh (umask now set via /etc/login.defs)
      file:
        path: /etc/profile.d/umask.sh
        state: absent

    - name: Set UMASK to 002 in /etc/login.defs
      lineinfile:
        path: /etc/login.defs
        regexp: '^UMASK'
        line: 'UMASK           002'
        state: present

    - name: Deploy /etc/profile.d/rez.sh
      copy:
        src: Files/rez.sh
        dest: /etc/profile.d/rez.sh
        owner: root
        group: root
        mode: '0644'
