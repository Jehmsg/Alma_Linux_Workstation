---
- name: Install Desktop Environment
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install KDE Plasma Workspaces
      dnf:
        name:
          - '@KDE Plasma Workspaces'
          - '@base-x'
        state: present

    - name: Detect installed kdeconnect packages
      ansible.builtin.shell: |
        rpm -q kdeconnect kdeconnectd 2>/dev/null | grep '^kde' || true
      register: kdeconnect_pkgs
      changed_when: false
      failed_when: false

    - name: Remove kdeconnect (broken, throws constant errors)
      dnf:
        name: "{{ kdeconnect_pkgs.stdout_lines }}"
        state: absent
      when: kdeconnect_pkgs.stdout_lines


    - name: Set graphical target as default
      ansible.builtin.file:
        src: /usr/lib/systemd/system/graphical.target
        dest: /etc/systemd/system/default.target
        state: link
        force: true

    - name: Configure SDDM
      ansible.builtin.lineinfile:
        path: /etc/sddm.conf
        regexp: '^#?{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: MinimumUid, value: '99999' }
        - { key: MaximumUid, value: '99999' }
        - { key: RememberLastUser, value: 'false' }

    - name: Default display server to X11
      ansible.builtin.copy:
        dest: /etc/sddm.conf.d/10-display-server-x11.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [General]
          DisplayServer=x11
